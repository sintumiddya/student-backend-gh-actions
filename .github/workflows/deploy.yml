name: Deploy Backend to AWS EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test:
    name: Test MERN Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check server syntax
        run: node --check src/server.js

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          command_timeout: 10m

          script: |
            set -e

            echo "========================================="
            echo "DEPLOYMENT STARTED"
            echo "Time: $(date)"
            echo "========================================="

            APP_DIR="/var/www/backend"
            REPO_URL="https://github.com/${{ github.repository }}.git"
            BRANCH="main"

            echo "Application directory: $APP_DIR"
            echo "Repository: $REPO_URL"

            # ------------------------------------------------
            # Create application directory
            # ------------------------------------------------

            sudo mkdir -p "$APP_DIR"
            sudo chown -R "$USER":"$USER" "$APP_DIR"

            # ------------------------------------------------
            # First deployment
            # ------------------------------------------------

            if [ ! -d "$APP_DIR/.git" ]; then

              echo "No Git repository found."

              # Backup .env if it already exists
              if [ -f "$APP_DIR/.env" ]; then
                echo "Backing up existing .env..."
                cp "$APP_DIR/.env" /tmp/backend-env-backup
              fi

              # Backup PM2 ecosystem file if it already exists
              if [ -f "$APP_DIR/ecosystem.config.js" ]; then
                echo "Backing up ecosystem.config.js..."
                cp "$APP_DIR/ecosystem.config.js" /tmp/backend-ecosystem-backup
              fi

              echo "Cleaning application directory..."

              # Remove everything including hidden files
              find "$APP_DIR" -mindepth 1 -maxdepth 1 -exec rm -rf {} +

              echo "Cloning repository..."

              git clone \
                --branch "$BRANCH" \
                --single-branch \
                "$REPO_URL" \
                "$APP_DIR"

              cd "$APP_DIR"

              # Restore .env
              if [ -f "/tmp/backend-env-backup" ]; then
                echo "Restoring .env..."
                cp /tmp/backend-env-backup "$APP_DIR/.env"
                rm -f /tmp/backend-env-backup
              fi

              # Restore ecosystem config
              if [ -f "/tmp/backend-ecosystem-backup" ]; then
                echo "Restoring ecosystem.config.js..."
                cp /tmp/backend-ecosystem-backup "$APP_DIR/ecosystem.config.js"
                rm -f /tmp/backend-ecosystem-backup
              fi

            else

              # ------------------------------------------------
              # Existing deployment
              # ------------------------------------------------

              echo "Existing Git repository found."
              echo "Pulling latest changes..."

              cd "$APP_DIR"

              git fetch origin "$BRANCH"

              git reset --hard "origin/$BRANCH"

              git clean -fd

            fi

            # ------------------------------------------------
            # Check files
            # ------------------------------------------------

            cd "$APP_DIR"

            echo "Current commit:"
            git log -1 --oneline

            echo "Checking package.json..."

            if [ ! -f "package.json" ]; then
              echo "ERROR: package.json not found!"
              exit 1
            fi

            # ------------------------------------------------
            # Install production dependencies
            # ------------------------------------------------

            echo "Installing production dependencies..."

            npm ci --omit=dev

            # ------------------------------------------------
            # Check ecosystem config
            # ------------------------------------------------

            if [ ! -f "ecosystem.config.js" ]; then
              echo "ERROR: ecosystem.config.js not found!"
              exit 1
            fi

            # ------------------------------------------------
            # PM2 deployment
            # ------------------------------------------------

            echo "Checking PM2..."

            if pm2 describe backend-api > /dev/null 2>&1; then

              echo "backend-api already running."
              echo "Reloading application..."

              pm2 reload ecosystem.config.js --env production

            else

              echo "backend-api not running."
              echo "Starting application..."

              pm2 start ecosystem.config.js --env production

            fi

            # ------------------------------------------------
            # Save PM2 process list
            # ------------------------------------------------

            pm2 save

            # ------------------------------------------------
            # Show PM2 status
            # ------------------------------------------------

            echo "PM2 status:"

            pm2 status

            # ------------------------------------------------
            # Wait for application
            # ------------------------------------------------

            echo "Waiting for application to start..."

            sleep 5

            # ------------------------------------------------
            # Health check
            # ------------------------------------------------

            echo "Running health check..."

            HTTP_STATUS=$(curl \
              -s \
              -o /dev/null \
              -w "%{http_code}" \
              http://127.0.0.1:5000/api/health || true)

            echo "Health check HTTP status: $HTTP_STATUS"

            if [ "$HTTP_STATUS" = "200" ]; then

              echo "========================================="
              echo "SUCCESS: Backend health check passed!"
              echo "HTTP Status: $HTTP_STATUS"
              echo "========================================="

            else

              echo "========================================="
              echo "WARNING: Health check failed!"
              echo "HTTP Status: $HTTP_STATUS"
              echo "========================================="

              echo "PM2 status:"
              pm2 status

              echo "Recent PM2 logs:"
              pm2 logs backend-api --lines 30 --nostream

              exit 1

            fi

            # ------------------------------------------------
            # Final Nginx check
            # ------------------------------------------------

            echo "Checking Nginx configuration..."

            sudo nginx -t

            echo "Reloading Nginx..."

            sudo systemctl reload nginx

            echo "Nginx status:"

            sudo systemctl is-active nginx

            # ------------------------------------------------
            # Deployment complete
            # ------------------------------------------------

            echo "========================================="
            echo "DEPLOYMENT FINISHED SUCCESSFULLY"
            echo "Time: $(date)"
            echo "========================================="
